<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.url == '/' %}{{ site.title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/avif" href="{{ '/assets/images/ntu_sentinels.avif' | relative_url }}">
    <link rel="preload" href="{{ '/assets/fonts/FantasqueSansMono-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/FantasqueSansMono-Bold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/JetBrainsMono-wght.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/vendor/particles.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/particles-background.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/typing-effect.js' | relative_url }}" defer></script>
  </head>
  <body>
    <div id="particles-js" aria-hidden="true"></div>
    {% include masthead.html %}
    <main class="site-content" id="main-content" aria-label="{{ page.title | default: site.title | escape }}">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
